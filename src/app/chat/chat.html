<section class="chat" [attr.aria-labelledby]="headingId">
  <header class="chat-header">
    <span class="avatar" aria-hidden="true"><mat-icon>explore</mat-icon></span>
    <h2 [id]="headingId">{{ t().chat.heading }}</h2>
  </header>

  <div class="history" #history role="log" aria-live="polite">
    <p class="bubble">{{ t().chat.greeting }}</p>
    @for (message of store.messages(); track message.id) {
      <p class="bubble" [class.user]="message.from === 'user'">{{ message.text }}</p>
    }
  </div>

  <form class="composer" (ngSubmit)="send()">
    <label class="visually-hidden" [for]="inputId">{{ t().chat.inputLabel }}</label>
    <textarea
      [id]="inputId"
      name="draft"
      [placeholder]="t().chat.placeholder"
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="5"
      [(ngModel)]="draft"
      (keydown)="onKeydown($event)"
    ></textarea>
    <button
      mat-icon-button
      class="send"
      type="submit"
      [attr.aria-label]="t().chat.submit"
      [disabled]="!draft().trim()"
    >
      <mat-icon>arrow_upward</mat-icon>
    </button>
  </form>
</section>
